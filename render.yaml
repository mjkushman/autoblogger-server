services:
  - type: web
    runtime: node
    name: autoblogger-server
    plan: free # change to match your Render plan
    # typescript is a devDependency, so install it even when NODE_ENV=production
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # set the value in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_KEY
        sync: false
      - key: UNSPLASH_CLIENT_ID
        sync: false
